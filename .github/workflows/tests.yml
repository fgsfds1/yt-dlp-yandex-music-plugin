name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lower bound = yt-dlp's own minimum; upper = current
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install yt-dlp + plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yt-dlp>=2024.03.10" .
      - name: Sign-algorithm regression tests
        run: python tests/test_sign.py
      - name: URL-matching tests
        run: python tests/test_url_matching.py
      - name: Preview-mode guard tests
        run: python tests/test_preview_warning.py
      - name: Plugin install check
        run: python tools/check_install.py

  test-min:
    # the declared yt-dlp floor must actually work: shadowing the built-in
    # extractor only works on newer yt-dlp (see pyproject.toml comment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install declared minimum yt-dlp + plugin
        run: |
          python -m pip install --upgrade pip
          floor=$(grep -oP 'yt-dlp>=\K[0-9.]+' pyproject.toml)
          echo "installing yt-dlp==$floor"
          python -m pip install "yt-dlp==$floor" .
      - name: Plugin install check
        run: python tools/check_install.py

  build:
    # packaging sanity: sdist + wheel must build on every push/PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
