name: Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # lower bound = yt-dlp's own minimum; upper = current
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install yt-dlp + plugin
        run: |
          python -m pip install --upgrade pip
          # latest yt-dlp (the declared floor is enforced by the plugin's
          # own dependency and tested separately by the test-min job)
          python -m pip install yt-dlp .
      - name: Sign-algorithm regression tests
        run: python tests/test_sign.py
      - name: URL-matching tests
        run: python tests/test_url_matching.py
      - name: Preview-mode guard tests
        run: python tests/test_preview_warning.py
      - name: RSC payload parsing tests
        run: python tests/test_rsc_payload.py
      - name: Key rotation / 403 handling tests
        run: python tests/test_key_refresh.py
      - name: Artist pagination tests
        run: python tests/test_artist_pagination.py
      - name: Track extraction tests
        run: python tests/test_track_extract.py
      - name: Playlist / album / artist-albums extractor tests
        run: python tests/test_playlist_extract.py
      - name: Full suite under pytest (shared-fixture mode)
        # the files also run as plain scripts above; pytest exercises the
        # conftest.py fixtures and would catch cross-file state leaks
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q
      - name: Plugin install check
        run: python tools/check_install.py

  test-min:
    # the declared yt-dlp floor must actually work: shadowing the built-in
    # extractor only works on newer yt-dlp (see pyproject.toml comment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.10"
      - name: Install declared minimum yt-dlp + plugin
        run: |
          python -m pip install --upgrade pip
          floor=$(grep -oP '"yt-dlp>=\K[0-9.]+' pyproject.toml)
          echo "installing yt-dlp==$floor"
          python -m pip install "yt-dlp==$floor" .
      - name: Plugin install check
        run: python tools/check_install.py

  build:
    # packaging sanity: sdist + wheel must build on every push/PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/
