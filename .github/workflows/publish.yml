# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored.
#
# One-time setup (see README → "Publishing"):
#   1. GitHub: Settings → Environments → create environment "pypi"
#   2. PyPI: account → Publishing → add a *pending* GitHub publisher:
#      owner fgsfds1, repo yt-dlp-yandex-music-plugin, workflow publish.yml,
#      environment pypi, project name yt-dlp-yandex-music
#      (the project is created automatically on first publish)
#
# Release flow: tag the commit (CalVer, no "v" prefix), create a GitHub
# Release from that tag and publish it → this workflow runs.
# Pre-release: mark the GitHub Release as pre-release and use a tag with
# an rcN suffix (e.g. 2026.09.16rc1).
# Manual: Actions → Publish to PyPI → Run workflow — the tag input is
# REQUIRED (a missing tag used to silently resolve to the latest
# already-published tag and no-op).
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (CalVer, e.g. 2026.09.16.1)"
        required: true
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0 # tags needed for the git-describe fallback
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0)
          echo "Resolved version tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate CalVer tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          echo "$tag" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+|rc[0-9]+)?$' \
            || { echo "::error::'$tag' is not CalVer — expected YYYY.MM.DD with optional .N or rcN suffix"; exit 1; }
          date -d "${tag:0:4}-${tag:5:2}-${tag:8:2}" >/dev/null \
            || { echo "::error::'$tag' is not a real calendar date"; exit 1; }
      - name: Set version in pyproject.toml
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.tag }}\"/" pyproject.toml
          grep '^version' pyproject.toml
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true # makes workflow re-runs idempotent
