# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored.
#
# One-time setup (see README → "Publishing"):
#   1. GitHub: Settings → Environments → create environment "pypi"
#   2. PyPI: account → Publishing → add a *pending* GitHub publisher:
#      owner fgsfds1, repo yt-dlp-yandex-music-plugin, workflow publish.yml,
#      environment pypi, project name yt-dlp-yandex-music
#      (the project is created automatically on first publish)
#
# Release flow: tag the commit (CalVer, no "v" prefix), create a GitHub
# Release from that tag and publish it → this workflow runs.
# Pre-release: mark the GitHub Release as pre-release and use a tag with
# an rcN suffix (e.g. 2026.09.16rc1).
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (default: latest tag on this branch)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags needed for the git-describe fallback
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0)
          echo "Resolved version tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate CalVer tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          echo "$tag" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+|rc[0-9]+)?$' \
            || { echo "::error::'$tag' is not CalVer — expected YYYY.MM.DD with optional .N or rcN suffix"; exit 1; }
          date -d "${tag:0:4}-${tag:5:2}-${tag:8:2}" >/dev/null \
            || { echo "::error::'$tag' is not a real calendar date"; exit 1; }
      - name: Set version in pyproject.toml
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.tag }}\"/" pyproject.toml
          grep '^version' pyproject.toml
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true # makes workflow re-runs idempotent
