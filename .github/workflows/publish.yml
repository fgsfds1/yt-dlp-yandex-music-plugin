# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored.
#
# One-time setup (see README → "Publishing"):
#   1. GitHub: Settings → Environments → create environment "pypi"
#   2. PyPI: account → Publishing → add a *pending* GitHub publisher:
#      owner fgsfds1, repo yt-dlp-yandex-music-plugin, workflow publish.yml,
#      environment pypi, project name yt-dlp-yandex-music
#      (the project is created automatically on first publish)
#
# Release flow: tag the commit (CalVer, no "v" prefix), create a GitHub
# Release from that tag and publish it → this workflow runs.
# Pre-release: mark the GitHub Release as pre-release and use a tag with
# an rcN suffix (e.g. 2026.09.16rc1).
# Manual: Actions → Publish to PyPI → Run workflow — the tag input is
# REQUIRED and must be an existing tag (a nonexistent tag used to publish
# master under an arbitrary version; a missing one used to silently
# resolve to the latest already-published tag and no-op).
#
# The test job gates the build: a red commit cannot be published.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (an existing CalVer tag, e.g. 2026.09.16.1)"
        required: true
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    # a release must not publish a red commit — run the suite first
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install yt-dlp + plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp pytest .
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Plugin install check
        run: python tools/check_install.py

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # env (not ${{ }} in the shell): the tag is untrusted input and must
    # not be shell-interpolated before it is validated
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0 # full tag list for the tag-existence check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Validate version tag
        run: |
          [ -n "$TAG" ] || { echo "::error::no version tag given"; exit 1; }
          echo "$TAG" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+|rc[0-9]+)?$' \
            || { echo "::error::'$TAG' is not CalVer — expected YYYY.MM.DD with optional .N or rcN suffix"; exit 1; }
          date -d "${TAG:0:4}-${TAG:5:2}-${TAG:8:2}" >/dev/null \
            || { echo "::error::'$TAG' is not a real calendar date"; exit 1; }
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag '$TAG' does not exist in this repository"; exit 1; }
          echo "Publishing tag: $TAG"
      - name: Set version in pyproject.toml
        run: |
          sed -i "s/^version = .*/version = \"$TAG\"/" pyproject.toml
          # the sed above is a no-op if the line is ever reformatted —
          # assert the injection actually happened
          python - <<'EOF'
          import os, tomllib
          v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert v == os.environ['TAG'], \
              f'injected version {v!r} != tag {os.environ["TAG"]!r}'
          print('version injected:', v)
          EOF
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true # makes workflow re-runs idempotent
