[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-dlp-yandex-music-v2"
version = "1.0.0"
description = "yt-dlp plugin: Yandex Music via the modern api.music.yandex.ru (fixes the broken built-in extractor, adds shared-playlist URL support)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lw" }]
keywords = ["yt-dlp", "plugin", "yandex-music", "extractor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
# the plugin is passive; yt-dlp is only needed at runtime by the host
dependencies = []

[project.urls]
Homepage = "https://example.invalid/yt-dlp-yandex-music-v2"

[tool.setuptools]
# namespace package layout expected by yt-dlp's plugin loader:
#   <site-packages>/yt_dlp_plugins/extractor/<module>.py
packages = ["yt_dlp_plugins", "yt_dlp_plugins.extractor"]
